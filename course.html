, services, permissions and resources.'],['AWS Administrator','Support and manage AWS cloud resources and operational environments.'],['CI/CD Engineer','Design and maintain automated build, testing and deployment pipelines.'],['Automation Engineer','Implement infrastructure and application automation using tools such as Ansible and Jenkins.'],['Cloud Support Engineer','Support cloud infrastructure, deployments, monitoring and operational activities.'],['Infrastructure Engineer','Work across servers, cloud infrastructure, automation and deployment environments.']].map(([t,p])=>`<article class="role"><h3>${t}</h3><p>${p}</p></article>`).join('')}</div></section><section class="page support"><div class="reveal"><p class="kicker">Career support / job readiness</p><div class="heading"><h2>Transform Technical Learning into Professional Readiness</h2><p>A strong cloud profile is built by combining technical knowledge with demonstrable implementation skills.</p></div></div><div class="support-grid">${[['01','Technical Profile Development','Present your AWS, Linux, DevOps, automation and containerization capabilities clearly.'],['02','Project Portfolio Building','Showcase practical work involving AWS deployment, CI/CD, Ansible, Docker and monitoring.'],['03','Technical Interview Preparation','Strengthen understanding of cloud infrastructure, Linux, Git, Jenkins, Docker and DevOps concepts.'],['04','Project Discussion Readiness','Learn to explain architecture, deployment workflows, automation processes and technology choices.'],['05','Professional Profile Enhancement','Organize your technical projects and cloud competencies into a structured professional profile.'],['06','Opportunity Preparation','Prepare for roles across cloud engineering, DevOps, infrastructure, automation and cloud support.']].map(([n,t,p])=>`<article class="support-item reveal"><span>${n}</span><h3>${t}</h3><p>${p}</p></article>`).join('')}</div><p class="framework reveal">Your Cloud Career Framework: Learn → Practice → Build → Showcase → Prepare → Progress</p></section><section class="closing"><p class="eyebrow">Ready when you are</p><h2>Start engineering what’s next.</h2><p>Speak with a Multicore advisor to plan your next move into cloud and DevOps.</p><button class="button" type="button" data-brochure-enquiry>Download brochure ↓</button></section>`;
